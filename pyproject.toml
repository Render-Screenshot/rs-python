[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renderscreenshot"
version = "1.0.0"
description = "Official Python SDK for RenderScreenshot - Screenshot API for developers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Michael Brooks", email = "michael@renderscreenshot.com" }
]
keywords = [
    "screenshot",
    "api",
    "screenshot-api",
    "web-capture",
    "browser-rendering",
    "og-image",
    "social-cards",
    "pdf",
    "renderscreenshot"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://renderscreenshot.com"
Documentation = "https://renderscreenshot.com/docs"
Repository = "https://github.com/Render-Screenshot/rs-python"
Issues = "https://github.com/Render-Screenshot/rs-python/issues"
Changelog = "https://github.com/Render-Screenshot/rs-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pip-audit>=2.6.0",
    "bandit>=1.7.0",
    "pre-commit>=3.0",
    "detect-secrets>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/renderscreenshot"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator - sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["renderscreenshot"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/renderscreenshot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Allow assert in tests
